<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e113a" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #f472b6; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6; #38bdf8; #818cf8; #c084fc; #f472b6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.45; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -80; }
    }
    .orb1 { animation: pulseOrb 9s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 11s ease-in-out infinite reverse; transform-origin: 1000px 240px; }
    .float1 { animation: floatParticle 5s ease-in-out infinite; }
    .float2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .float3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .stream-line { stroke-dasharray: 8 12; animation: dashMove 4s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bg)" rx="16" />

  <!-- Animated Glowing Orbs (Behind content) -->
  <circle class="orb1" cx="220" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb2" cx="980" cy="240" r="160" fill="#a855f7" filter="url(#glow)" />
  <circle cx="600" cy="170" r="90" fill="#ec4899" filter="url(#glow)" opacity="0.15" />

  <!-- Dynamic Neural Network / Research Graph in Background -->
  <g stroke="#64748b" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="80" y1="170" x2="240" y2="280" />
    <line x1="240" y1="280" x2="420" y2="230" />
    <line x1="420" y1="230" x2="600" y2="290" />
    <line x1="600" y1="290" x2="780" y2="220" />
    <line x1="780" y1="220" x2="960" y2="280" />
    <line x1="960" y1="280" x2="1120" y2="180" />
    <line x1="200" y1="60" x2="380" y2="110" />
    <line x1="820" y1="70" x2="1020" y2="90" />
  </g>

  <!-- Animated Stream Lines -->
  <path class="stream-line" d="M 50 170 Q 300 240 600 170 T 1150 170" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" />
  <path class="stream-line" d="M 50 200 Q 350 120 650 200 T 1150 200" fill="none" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.8" />

  <!-- Floating Ambient Particles -->
  <circle class="float1" cx="160" cy="110" r="3" fill="#38bdf8" />
  <circle class="float2" cx="310" cy="230" r="4" fill="#818cf8" />
  <circle class="float3" cx="890" cy="110" r="3.5" fill="#f472b6" />
  <circle class="float1" cx="1060" cy="220" r="4.5" fill="#38bdf8" />
  <circle class="float2" cx="520" cy="70" r="3" fill="#c084fc" />

  <!-- Foreground Title and Content -->
  <g text-anchor="middle">
    <!-- Top Category Pill -->
    <rect x="420" y="32" width="360" height="32" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="600" y="53" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">⚡ THE CURATED RESEARCH ECOSYSTEM</text>

    <!-- Main Title (Strictly Foregrounded & Scaled) -->
    <text x="600" y="125" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Awesome AI Research Prompts</text>

    <!-- Subtitle -->
    <text x="600" y="165" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500">Autonomous Agents • Literature Synthesis • System Prompt Reverse-Engineering</text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 195)">
      <!-- Tag 1 -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="200" height="36" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
        <text x="100" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📚 138M+ Papers Grounded</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(460, 0)">
        <rect x="0" y="0" width="280" height="36" rx="8" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
        <text x="140" y="23" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔓 Frontier System Prompt Leaks</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(760, 0)">
        <rect x="0" y="0" width="200" height="36" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
        <text x="100" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Production AI Agents</text>
      </g>
    </g>

    <!-- Footer Meta Stats Line -->
    <text x="600" y="285" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Verified SaaS Pricing &amp; Metrics • 100% Free Tiers Identified • Open-Source Sorted by Real Stargazers</text>
  </g>
</svg>
